<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>TFAZZIO Consultoria | Clareza para Crescer</title>
  <meta name="description" content="A TFAZZIO identifica o limitador da sua empresa e te ajuda a elimina-lo." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bordo: #6B0F1A; --bordo-mid: #7B1D2E; --bordo-dark: #4A0A12;
      --gold: #D4AF37; --gold-pale: #E8CC6A;
      --graphite: #1A1A1A; --mid: #2E2E2E; --muted: #5A6270; --silver: #8A929C;
      --rule: #D8D3CB; --white: #FFFFFF; --off: #F9F7F3; --cream: #F2EEE7; --cream-mid: #E8E2D8;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--white); color: var(--graphite); font-family: 'Barlow', sans-serif;
      font-weight: 300; line-height: 1.75; overflow-x: hidden; -webkit-font-smoothing: antialiased;
    }
    .t-label {
      font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 600;
      letter-spacing: 5px; text-transform: uppercase; color: var(--gold); display: block;
    }
    .t-label--pale { color: rgba(212,175,55,0.75); }
    .t-display {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 500; line-height: 1.08; color: var(--graphite);
    }
    .t-display em { font-style: italic; color: var(--bordo); }
    .t-display--lg { font-size: clamp(32px, 4.5vw, 64px); }
    .t-display--inv { color: var(--white); }
    .t-display--inv em { color: var(--gold-pale); }
    .t-body { font-size: 16px; color: var(--muted); line-height: 1.85; }
    .t-pull {
      font-family: 'Barlow', sans-serif; font-weight: 300; font-style: italic;
      color: var(--graphite); line-height: 1.45; font-size: clamp(18px, 2.2vw, 26px);
    }
    .btn {
      display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
      font-weight: 600; letter-spacing: 3px; text-transform: uppercase; text-decoration: none;
      padding: 17px 48px; transition: all 0.22s; cursor: pointer; border: none; line-height: 1;
    }
    .btn--bordo { background: var(--bordo); color: var(--white); }
    .btn--bordo:hover { background: var(--bordo-mid); transform: translateY(-2px); }
    .btn--gold { background: var(--gold); color: var(--bordo-dark); }
    .btn--gold:hover { background: var(--gold-pale); transform: translateY(-2px); }
    .btn--dark { background: var(--graphite); color: var(--white); }
    .btn--dark:hover { background: #000; transform: translateY(-2px); }
    .btn--block { display: block; width: 100%; text-align: center; }
    .btn--sm { padding: 13px 32px; font-size: 10px; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 60px; }
    .wrap--narrow { max-width: 860px; margin: 0 auto; padding: 0 60px; }
    .section { padding: 120px 0; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 68px;
      display: flex; align-items: center; justify-content: space-between; padding: 0 60px;
      background: rgba(255,255,255,0.96); border-bottom: 1px solid var(--cream-mid);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .nav-logo-text {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px;
      letter-spacing: 5px; color: var(--bordo); text-decoration: none;
    }
    .nav-links { display: flex; align-items: center; gap: 36px; }
    .nav-link {
      font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600;
      letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s;
    }
    .nav-link:hover { color: var(--bordo); }
    .nav-cta {
      font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
      letter-spacing: 2.5px; text-transform: uppercase; text-decoration: none;

    .nav-cta:hover { background: var(--bordo-mid); }
    .nav-hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 4px; }
    .nav-hamburger span { display: block; width: 22px; height: 1.5px; background: var(--bordo); }
    .mob-menu {
      display: none; position: fixed; top: 68px; left: 0; right: 0; background: var(--white);
      border-bottom: 1px solid var(--cream-mid); padding: 28px 32px 36px; flex-direction: column; gap: 0;
      z-index: 199; max-height: calc(100vh - 68px); overflow-y: auto;

    .mob-menu.open { display: flex; }
    .mob-menu .nav-link { padding: 14px 0; border-bottom: 1px solid var(--cream); font-size: 12px; }

    .hero {
      min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
      padding: 130px 60px 110px; position: relative; overflow: hidden; background: var(--white);
    }
    .hero-content { max-width: 860px; }
    .hero-eyebrow {
      font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 600;
      letter-spacing: 5px; text-transform: uppercase; color: var(--gold); margin-bottom: 44px;
      opacity: 0; animation: fu 0.8s ease forwards 0.1s;
    }
    .hero-headline {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 500;
      font-size: clamp(40px, 6vw, 84px); line-height: 1.05; color: var(--graphite);
      opacity: 0; animation: revUp 1.2s cubic-bezier(0.16,1,0.3,1) forwards 0.25s;
    }
    .hero-headline em { font-style: italic; color: var(--bordo); }
    .hero-rule {
      width: 1px; height: 64px; background: linear-gradient(to bottom, var(--gold) 60%, transparent);
      display: block; margin: 48px 0; opacity: 0; animation: fu 0.7s ease forwards 0.7s;
    }
    .hero-subhead {
      font-family: 'Barlow', sans-serif; font-size: clamp(18px, 2.2vw, 26px); font-weight: 300;
      color: var(--muted); line-height: 1.5; margin-bottom: 20px; max-width: 640px;
      opacity: 0; animation: fu 0.8s ease forwards 0.8s;
    }
    .hero-body {
      font-size: 16px; color: var(--silver); line-height: 1.85; max-width: 560px; margin-bottom: 52px;
      opacity: 0; animation: fu 0.8s ease forwards 0.95s;
    }
    .hero-actions {
      display: flex; flex-direction: column; align-items: flex-start; gap: 16px;
      opacity: 0; animation: fu 0.8s ease forwards 1.1s;
    }
    .hero-friction { font-size: 13px; color: var(--silver); font-style: italic; line-height: 1.6; }
    @keyframes fu { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes revUp { from { opacity: 0; transform: translateY(40px); filter: blur(4px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }

    .prod-card--destaque .prod-detail li::before { color: var(--gold); }
    .prod-card--destaque .prod-detail-label { color: rgba(255,255,255,0.4); }
    .prod-card--destaque .prod-detail-note { color: rgba(255,255,255,0.45); }
    .prod-card--destaque .prod-expand { color: var(--gold-pale); border-color: var(--gold-pale); }
    .prod-card--destaque .prod-expand:hover { color: var(--white); border-color: var(--white); }
    .prod-tag {
      font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase; color: var(--silver); margin-bottom: 16px;
    }
    .prod-name {
      font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 500;
      color: var(--graphite); line-height: 1.15; margin-bottom: 12px;

    .prod-headline {
      font-size: 14px; color: var(--muted); line-height: 1.75; margin-bottom: 28px; flex-grow: 1;

    .prod-price-note { font-size: 12px; color: var(--silver); margin-bottom: 24px; font-style: italic; }
    .prod-expand {
      font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase; color: var(--bordo); text-decoration: none;

    .prod-expand:hover { opacity: 0.6; }
    .prod-details {

    .prod-details.open { max-height: 1200px; opacity: 1; margin-top: 32px; }
    .prod-detail-label {
      font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase; color: var(--silver); margin-bottom: 12px; display: block;

    .prod-detail { list-style: none; margin-bottom: 24px; }
    .prod-detail li {
      font-size: 14px; color: var(--muted); padding: 10px 0; border-bottom: 1px solid var(--cream-mid);
      display: flex; gap: 10px; line-height: 1.6;

    .prod-detail li:last-child { border-bottom: none; }
    .prod-detail li::before { content: '->'; color: var(--gold); flex-shrink: 0; font-size: 12px; }

    .advisor { background: var(--graphite); }

    .advisor-title { color: var(--white); margin-bottom: 24px; }

    .advisor-card .prod-expand { color: var(--gold-pale); border-color: var(--gold-pale); }
    .advisor-card .prod-expand:hover { opacity: 0.7; }
    .advisor-card .prod-detail li { color: rgba(255,255,255,0.55); border-bottom-color: rgba(255,255,255,0.06); }
    .advisor-card .prod-detail li::before { color: var(--gold); }
    .advisor-card .prod-detail-label { color: rgba(255,255,255,0.35); }

    .quem-bio-block { background: var(--bordo); padding: 32px; }

    .creds { display: flex; flex-wrap: wrap; gap: 8px; margin: 28px 0 20px; }

      font-weight: 500; color: var(--graphite); line-height: 1.15; margin-bottom: 12px;
    }
    .ebook-title-sm em { font-style: italic; color: var(--bordo); }
